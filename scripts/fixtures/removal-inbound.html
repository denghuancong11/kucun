<!doctype html><meta charset="utf-8"><style>td,th{min-width:80px}button,input{min-width:60px}</style>
<p>DOM模拟物流数据</p><button id="reset">重置</button><div class="search-block"><div class="field-select"><input readonly value="" id="type"><span class="fake-select-label" id="typeLabel">入库单号</span><div hidden id="options" class="el-select-dropdown"><ul><li class="el-select-dropdown__item">移除单号</li></ul></div></div><div class="search-mode-select"><input readonly value="模糊"></div><div class="search-input"><input id="order"></div></div>
<span>移除单号</span><span>移除单号</span><button id="query">查询</button><input placeholder="开始日期" value="2026-08-10"><input placeholder="结束日期" value="2026-09-09">
<div class="vxe-table--main-wrapper"><div class="vxe-table--header-wrapper body--wrapper"><table><thead><tr><th class="col_1">图片</th><th class="col_2">MSKU</th><th class="col_3">FNSKU</th><th class="col_4">申报量</th></tr></thead></table></div><div class="vxe-table--body-wrapper body--wrapper"><table><tbody id="rows"></tbody></table></div></div>
<div class="el-pagination">共2条<ul class="el-pager"><li class="active">1</li><li>2</li></ul><button class="btn-next">下一页</button></div>
<script>
let current=1,expanded=false;const q=s=>document.querySelector(s);
function render(){q('#rows').innerHTML='<tr><td colspan="4">OWR2026000'+current+' 店铺 TEST-US 美国 移除单号 TEST-ORDER 入库仓库 - 发货日期 2026-09-01T02:50:19-07:00 承运商 UPS 运单号 T'+current+' 备注 - <button aria-expanded="'+expanded+'">'+(expanded?'收起':'展开')+'</button></td></tr>'+(expanded?'<tr><td class="col_1"></td><td class="col_2">SKU-A</td><td class="col_3">X011111111</td><td class="col_4">'+(current===1?2:3)+'</td></tr>'+(current===1?'<tr><td class="col_1"></td><td class="col_2">SKU-B</td><td class="col_3">X022222222</td><td class="col_4">9</td></tr>':''):'');q('#rows button').onclick=()=>{expanded=!expanded;render()};q('.btn-next').disabled=current===2;[...document.querySelectorAll('.el-pager li')].forEach((el,i)=>el.classList.toggle('active',current===i+1));}
q('#reset').onclick=()=>{current=1;expanded=false;q('#order').value='';q('#typeLabel').textContent='入库单号';render()};q('#type').onclick=()=>{document.body.append(q('#options'));q('#options').hidden=false};q('#options li').onclick=()=>{q('#typeLabel').textContent='移除单号';q('#options').hidden=true};q('#query').onclick=()=>{current=1;expanded=false;render()};q('.btn-next').onclick=()=>{current++;expanded=false;render()};document.querySelectorAll('.el-pager li').forEach((el,i)=>el.onclick=()=>{current=i+1;expanded=false;render()});render();
</script>
